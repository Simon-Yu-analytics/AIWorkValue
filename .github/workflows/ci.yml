name: offline-quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make check
      - run: python -m compileall -q src scripts tests
